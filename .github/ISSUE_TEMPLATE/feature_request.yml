name: Feature request
description: Propose a portable addition or contract change
title: "proposal: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the portable problem without private environment details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior, boundaries and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link public sources or describe synthetic evidence and alternatives considered.
    validations:
      required: true
